[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relearn-finetuning"
version = "0.1.0"
description = "Private, leakage-safe data preparation for Re:Learn tutoring models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "datasets>=2.18",
  "transformers>=4.45",
  "peft>=0.13",
  "bitsandbytes>=0.44",
  "accelerate>=0.34",
  "torch>=2.2",
]
eval = ["datasets>=2.18", "transformers>=4.45", "torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

